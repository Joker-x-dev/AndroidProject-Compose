[versions]
# 构建工具版本
# Android Gradle Plugin: https://developer.android.com/studio/releases/gradle-plugin
agp = "9.4.0"
# Kotlin 编译器: https://kotlinlang.org/docs/releases.html
kotlin = "2.4.20"

# Android 核心库版本
# AndroidX Core KTX: https://developer.android.com/jetpack/androidx/releases/core
coreKtx = "1.19.0"
# AndroidX Activity Compose: https://developer.android.com/jetpack/androidx/releases/activity
activityCompose = "1.13.0"
# AndroidX Lifecycle Runtime KTX: https://developer.android.com/jetpack/androidx/releases/lifecycle
lifecycleRuntimeKtx = "2.11.0"

# 测试框架版本
# JUnit 4 测试框架: https://junit.org/junit4/
junit = "4.13.2"
# AndroidX JUnit 扩展: https://developer.android.com/jetpack/androidx/releases/test#test-ext-junit
junitVersion = "1.3.0"
# AndroidX Espresso 测试框架: https://developer.android.com/training/testing/espresso
espressoCore = "3.7.0"

# Jetpack Compose 相关版本
# Compose BOM: https://developer.android.com/jetpack/compose/bom
# 说明: BOM 统一管理所有 Compose 库版本，确保兼容性
composeBom = "2026.09.00"
# Compose Material3 Adaptive: https://developer.android.com/jetpack/androidx/releases/compose-material3-adaptive
androidxComposeMaterial3Adaptive = "1.3.0"

# 导航相关版本
# AndroidX Navigation3: https://developer.android.com/jetpack/androidx/releases/navigation3
navigation3 = "1.1.7"
# AndroidX Lifecycle: https://developer.android.com/jetpack/androidx/releases/lifecycle
lifecycleViewModelNavigation3 = "2.11.0"

# 序列化相关版本
# Kotlinx Serialization JSON: https://github.com/Kotlin/kotlinx.serialization
kotlinxSerializationJson = "1.11.0"

# 网络请求相关版本
# OkHttp HTTP 客户端: https://square.github.io/okhttp/
okhttp = "5.5.0"
# Retrofit HTTP 客户端: https://square.github.io/retrofit/
retrofit = "3.0.0"
# Retrofit Kotlinx Serialization 转换器: https://github.com/JakeWharton/retrofit2-kotlinx-serialization-converter
retrofit2KotlinxSerializationConverter = "1.0.0"
# OkHttp 日志拦截器: https://github.com/square/okhttp/tree/master/okhttp-logging-interceptor
loggingInterceptor = "5.5.0"
# Chucker 网络调试工具: https://github.com/ChuckerTeam/chucker
# 说明: 通过 OkHttp 拦截器机制在应用通知栏显示网络请求功能
chucker = "4.3.1"

# 日志框架版本
# Timber 日志库: https://github.com/JakeWharton/timber
timber = "5.0.1"

# 依赖注入相关版本
# Hilt 依赖注入框架: https://developer.android.com/training/dependency-injection/hilt-android
# GitHub: https://github.com/google/dagger
# 说明: 基于 Dagger 的 Android 依赖注入库
hilt = "2.60.1"
# Hilt Lifecycle ViewModel Compose: https://developer.android.com/jetpack/androidx/releases/hilt
hiltLifecycleViewModelCompose = "1.4.0"
# KSP (Kotlin Symbol Processing): https://github.com/google/ksp
# 说明: Kotlin 注解处理器，用于代码生成
ksp = "2.3.12"

# 启动页相关版本
# AndroidX Core Splashscreen: https://developer.android.com/jetpack/androidx/releases/core
# 说明: 提供启动画面 API，兼容 Android 12+ 的启动画面
androidxCoreSplashscreen = "1.2.0"

# 图片加载相关版本
# Coil Compose 图片加载库: https://coil-kt.github.io/coil/compose/
coilCompose = "2.7.0"

# 调试工具相关版本
# LeakCanary 内存泄漏检测工具: https://github.com/square/leakcanary
# 说明: 仅在 debug 构建中使用，用于检测内存泄漏
leakcanaryAndroid = "2.14"
# Logcat 日志查看器: https://github.com/getActivity/Logcat
# 说明: 仅在 debug 构建中使用，提供悬浮窗查看应用日志
logcat = "13.2"
# CustomActivityOnCrash 崩溃页面: https://github.com/Ereza/CustomActivityOnCrash
# 说明: 仅在 debug 构建中使用，展示未捕获异常的错误堆栈页面
customActivityOnCrash = "2.4.0"

# 数据库相关版本
# Room 数据库框架: https://developer.android.com/training/data-storage/room
# 说明: SQLite 的抽象层，提供流畅的数据库访问
room = "2.8.5"

# Toast 相关版本
# Toaster 吐司框架: https://github.com/getActivity/Toaster
toaster = "15.0"

# 权限
# XXPermissions 权限框架: https://github.com/getActivity/XXPermissions
xxpermissions = "28.3"

# 数据存储
# 腾讯 MMKV 高性能存储: https://github.com/Tencent/MMKV
mmkv = "2.4.2"

# 下拉刷新
# UltraSwipeRefresh Compose 刷新组件: https://github.com/jenly1314/UltraSwipeRefresh
ultraSwipeRefresh = "1.6.0"

# 骨架屏
# https://github.com/valentinilk/compose-shimmer
composeShimmer = "1.5.0"

# Miuix Compose UI 版本，提供 Xiaomi HyperOS 风格主题与组件
miuix = "0.9.4-rc01"

[libraries]
# AndroidX 基础组件
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Jetpack Compose UI
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "androidxComposeMaterial3Adaptive" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# 测试框架
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# 导航
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewModelNavigation3" }

# 序列化
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# 网络请求
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
retrofit2-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit2KotlinxSerializationConverter" }

# 日志
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# 依赖注入
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewModelCompose" }

# 图片加载
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }

# 启动页
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxCoreSplashscreen" }

# 调试工具
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanaryAndroid" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }
chucker-no-op = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chucker" }
logcat = { group = "com.github.getActivity", name = "Logcat", version.ref = "logcat" }
custom-activity-on-crash = { group = "cat.ereza", name = "customactivityoncrash", version.ref = "customActivityOnCrash" }

# 数据库
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }

# Toast
toaster = { group = "com.github.getActivity", name = "Toaster", version.ref = "toaster" }

# 数据存储相关库
mmkv = { group = "com.tencent", name = "mmkv", version.ref = "mmkv" }

# 权限相关库
xxpermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "xxpermissions" }

# 下拉刷新
ultra-swipe-refresh = { module = "com.github.jenly1314.UltraSwipeRefresh:refresh", version.ref = "ultraSwipeRefresh" }
ultra-swipe-refresh-indicator-classic = { module = "com.github.jenly1314.UltraSwipeRefresh:refresh-indicator-classic", version.ref = "ultraSwipeRefresh" }

# 骨架屏
compose-shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "composeShimmer" }

# Miuix 主题、基础组件与模糊效果
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# 序列化相关插件
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# 依赖注入相关插件
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
